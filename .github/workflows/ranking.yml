name: Ranking berechnen

on:
  schedule:
    - cron: '30 22 * * 1-5' # Mo-Fr nach US-Börsenschluss (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-main
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx scripts/buildRanking.ts
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
      - name: Ergebnis speichern
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add data/ranking.json data/scan.json data/earnings.json data/predictions.json data/track.json
          git diff --staged --quiet || git commit -m "Ranking aktualisiert"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
