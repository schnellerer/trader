name: Bots handeln

on:
  schedule:
    # Alle Bots werden alle 5 Minuten (Mo-Fr) angestoßen. Das Skript entscheidet selbst, welcher Bot dran ist:
    #  - Day-Trading-Bot: 6-21 Uhr UTC (Börsenzeiten), Gold-Bot: laufend, Langzeit-Bot: 15 und 23 Uhr UTC
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Welcher Bot? (auto, day, long, gold oder all)'
        default: 'all'

permissions:
  contents: write

# Nur ein Lauf gleichzeitig, damit sich die Läufe nicht gegenseitig überschreiben
concurrency:
  group: bots
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bot-Stand laden (Daten-Branch)
        run: |
          git clone --quiet --depth 1 --branch data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" botdata 2>/dev/null || {
            mkdir botdata
            git -C botdata init --quiet -b data
          }
      - name: Bots handeln lassen
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'auto' }}
          DATA_DIR: botdata
        run: npx --yes tsx@4 scripts/runBots.ts
      - name: Stand speichern
        if: always()
        run: |
          cd botdata
          [ -f bots.json ] || exit 0
          git config user.name "bot-server"
          git config user.email "bot-server@users.noreply.github.com"
          git add bots.json
          git commit --quiet --amend -m "Bot-Stand" 2>/dev/null || git commit --quiet -m "Bot-Stand"
          git push --quiet --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
