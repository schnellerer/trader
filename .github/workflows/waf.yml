name: W.A.F berechnen

on:
  schedule:
    - cron: '0 5 * * *' # täglich früh (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-main
  cancel-in-progress: false

jobs:
  waf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx@4 scripts/waf.ts
      - name: Ergebnis speichern
        run: |
          git config user.name "waf-bot"
          git config user.email "waf-bot@users.noreply.github.com"
          git add data/waf.json
          git diff --staged --quiet || git commit -m "W.A.F aktualisiert"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
