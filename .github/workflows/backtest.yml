name: Backtest berechnen

on:
  schedule:
    - cron: '0 4 * * 0' # jeden Sonntag
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-main
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx@4 scripts/backtest.ts
      - name: Ergebnis speichern
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add data/backtest.json
          git diff --staged --quiet || git commit -m "Backtest aktualisiert"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
